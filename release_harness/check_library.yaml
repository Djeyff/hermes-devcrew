# Self-improving check-library (E1). Append an entry whenever a new failure
# class is caught — never delete, never let it rot. Each entry is a permanent
# automated gate. Seeded 2026-06-14 from the session that designed this harness.
checks:
  - id: phantom-assignee
    incident: "cards created for non-spawnable profiles sat ready forever (4 incidents)"
    rule: "every card assignee must resolve via profiles.profile_exists"
    severity: block
    fixture: tests/release_harness/fixtures/phantom_assignee
  - id: false-route-premise
    incident: "Item 13 A1 claimed a route was missing when it existed → dead code"
    rule: "spec 'X is missing' claims must be grep-verified against the repo"
    severity: warn
    fixture: tests/release_harness/fixtures/false_route_premise
  - id: git-add-all-debris
    incident: "a worker git add -A pushed 18 build/log artifacts into a PR that merged to main"
    rule: "no gitignored/debris paths may be tracked in the release branch"
    severity: block
    fixture: tests/release_harness/fixtures/git_add_all_debris
  - id: broken-main-uncommitted-helper
    incident: "Item 12 committed a route importing an uncommitted helper → main build broken"
    rule: "every import target must be a tracked file or in the release branch"
    severity: block
    fixture: tests/release_harness/fixtures/broken_main_import
  - id: env-replace-all
    incident: "RET-241 branch srlanes-5fix used deprecated replace-all variable writes plus destructive SQL, silently wiping ~11 env vars and updatedBy fields on a live service"
    rule: "variable writes with destructive SQL in the same branch require a pre-write snapshot of the full variables map before merge"
    severity: block
    fixture: tests/release_harness/fixtures/env_replace_all
  - id: dropped-path-lane-map
    incident: "RET-246: lane map hand-transcribed from card prose dropped one of two paths on a single Files: bullet → file shipped with no lane's authority"
    rule: "lane map must equal the cards' own parsed Files: blocks and the working-tree change set (lane_map_verify) — derived, never transcribed"
    severity: block
    fixture: tests/release_harness/fixtures/dropped_path_lane_map
  - id: duplicate-release-lane
    incident: "t_3b42f921 (created 53s after t_a97c1916) both targeted PR #357 integration; both agents live — first claim (t_a97c1916) owns the lane, later dispatch stands down before any merge/pin mutation (same class as the earlier t_ad81e625 double-merge)"
    rule: "before any release-lane mutation (merge/pin/tag), scan the board for a live sibling card targeting the same PR/branch and verify its claim age + pid liveness; the earlier live claim owns the lane, later dispatches must stand down and complete with a stand-down note"
    severity: block
    fixture: tests/release_harness/fixtures/duplicate_release_lane
